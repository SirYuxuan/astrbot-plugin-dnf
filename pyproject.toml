[project]
name = "astrbot-plugin-dnf"
version = "1.6.0"
description = "AstrBot 查询插件：DNF 金币比例、油价、蛋价、EVE 吉他市场"
requires-python = ">=3.10"
dependencies = ["redis", "requests"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
