[project]
name = "astrbot-plugin-dnf"
version = "1.8.0"
description = "AstrBot 查询插件：DNF 金币比例、油价、蛋价及 EVE 查询"
requires-python = ">=3.10"
dependencies = ["redis", "requests"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
